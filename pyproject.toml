[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "totpcgi"
version = "0.7.1"
description = "A centralized hotp/totp solution based on google-authenticator"
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Konstantin Ryabitsev", email = "mricon@kernel.org" },
]
dependencies = [
    "passlib",
    "pyotp",
    "bcrypt",
]

[project.optional-dependencies]
cgi = ["flup", "qrcode"]
encrypted-secret = ["pycryptodome"]
ldap = ["python-ldap"]
mysql = ["pymysql"]
pgsql = ["psycopg2-binary"]

[project.urls]
Homepage = "https://github.com/mricon/totp-cgi"
Issues = "https://github.com/mricon/totp-cgi/issues"

[tool.setuptools]
packages = ["totpcgi", "totpcgi.backends"]
